[project]
name = "morpho-curator"
version = "0.1.0"
description = "Constrained post-impact allocation for a $100M USDC Morpho Blue meta-vault"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
